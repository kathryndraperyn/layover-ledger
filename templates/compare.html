<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Official providers | $site_name</title>
  <meta name="description" content="Compare the travel providers tracked by $site_name and see how many offers have verified source prices.">
  $canonical
  <meta property="og:type" content="website">
  <meta property="og:title" content="Official providers | $site_name">

  <link rel="stylesheet" href="/style.css">

</head>
<body>
  <header class="site-header"><a class="brand" href="/">$site_name</a><nav><a href="/">Offers</a><a href="/compare/">Providers</a></nav></header>
