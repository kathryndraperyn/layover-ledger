<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$provider offers | $site_name</title>
  <meta name="description" content="Verified travel offers from $provider, with observed prices and links to the official source.">
  $canonical
  <meta property="og:type" content="website">
  <meta property="og:title" content="$provider offers | $site_name">
  <meta property="og:description" content="Official travel offers and source links.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="$provider offers | $site_name">
  <meta name="twitter:description" content="Official travel offers and source links.">
  <link rel="stylesheet" href="/style.css">
  $schema
</head>
<body>
  <header class="site-header"><a class="brand" href="/">$site_name</a><nav><a href="/">Offers</a><a href="/compare/">Providers</a></nav></header>
  <main><p class="eyebrow"><a href="/">All offers</a> / Provider</p><section class="hero compact"><h1>$provider</h1><p>Book or check current terms on the <a href="$provider_url" rel="nofollow noopener">official website</a>. Offer source: <a href="$source_url" rel="nofollow noopener">official offers page</a>.</p></section><section class="offer-grid">$cards</section></main>
  <footer><p>Prices and terms can change. Confirm details with the linked provider before booking.</p></footer>
</body>
</html>
