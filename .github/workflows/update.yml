name: Refresh official travel offers

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape permitted official structured offers
        run: python scraper.py
      - name: Build static pages
        run: python build.py
      - name: Commit observed source refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          if git diff --cached --quiet; then
            echo "No source observation changed."
          else
            git commit -m "Refresh official travel offer observations"
            git push
          fi
